name: apply-forge-runtime-contract

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/apply-forge-runtime-contract.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-forge-runtime-contract
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Apply against current head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forge-1.19.2
          git reset --hard origin/forge-1.19.2
          python3 ci/apply-forge-runtime-contract.py
          rm -f ci/apply-forge-runtime-contract.py
          rm -f ci/apply-forge-runtime-contract.ready
          rm -f .github/workflows/apply-forge-runtime-contract.yml

      - name: Compile and package the amended contract
        shell: bash
        run: ./gradlew --no-daemon clean test build jarJar

      - name: Commit with retry-on-race
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'port: make Forge runtime contract explicit'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:forge-1.19.2; then
              exit 0
            fi
            git fetch origin forge-1.19.2
            git rebase origin/forge-1.19.2
            ./gradlew --no-daemon test build jarJar
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-forge-runtime-contract-diagnostics
          if-no-files-found: warn
          path: |
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
            ci/
