name: apply-forge-smoke-v2

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/apply-forge-smoke-v2.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-forge-smoke-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Replace the smoke harness atomically
        shell: bash
        run: |
          set -euo pipefail
          test -f ci/run-forge-smoke-v2.sh
          cp ci/run-forge-smoke-v2.sh ci/run-forge-smoke.sh
          chmod +x ci/run-forge-smoke.sh
          rm -f ci/run-forge-smoke-v2.sh
          rm -f ci/apply-forge-smoke-v2.ready
          rm -f .github/workflows/apply-forge-smoke-v2.yml

      - name: Commit the corrected validation invariant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate persistence semantics across Forge restart'
          git push origin HEAD:forge-1.19.2
