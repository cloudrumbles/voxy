name: apply-forge-storage-contract-r3

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/apply-forge-storage-contract-r3.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-forge-storage-contract-r3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Wait for preceding runtime contract and pin current head
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 240); do
            git fetch origin forge-1.19.2
            git reset --hard origin/forge-1.19.2
            if grep -Fq 'RocksDB/LMDB are allowed to rotate WAL' ci/run-forge-smoke.sh \
               && grep -Fq 'Runtime contract revision: forge-1.19.2-r2.' PORTING.md; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

      - name: Apply storage and native parity patch
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/apply-forge-storage-contract-r3-fixed.py
          rm -f ci/apply-forge-storage-contract-r3.py
          rm -f ci/apply-forge-storage-contract-r3-fixed.py
          rm -f ci/apply-forge-storage-contract-r3.ready
          rm -f .github/workflows/apply-forge-storage-contract-r3.yml

      - name: Test, build, and verify packaged natives
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean test build jarJar
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -Eq '(^|/)liblwjgl_lmdb\.so$|(^|/)lwjgl_lmdb\.dll$'
          jar tf "$jar_file" | grep -Eq '(^|/)liblwjgl_zstd\.so$|(^|/)lwjgl_zstd\.dll$'
          jar tf "$jar_file" | grep -qx 'META-INF/jarjar/metadata.json'
          unzip -p "$jar_file" META-INF/jarjar/metadata.json | grep -F 'rocksdbjni'
          unzip -p "$jar_file" META-INF/jarjar/metadata.json | grep -F '10.2.1'
          unzip -p "$jar_file" META-INF/jarjar/metadata.json | grep -F 'sqlite-jdbc'
          unzip -p "$jar_file" META-INF/jarjar/metadata.json | grep -F '3.49.1.0'

      - name: Commit with retry-on-race
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'port: restore Voxy storage and native runtime parity'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:forge-1.19.2; then
              exit 0
            fi
            git fetch origin forge-1.19.2
            git rebase origin/forge-1.19.2
            ./gradlew --no-daemon test build jarJar
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-forge-storage-contract-r3-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
            build/libs/
            ci/
