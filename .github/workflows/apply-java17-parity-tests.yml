name: apply-java17-parity-tests

on:
  push:
    branches:
      - port/forge-1.19.2
    paths:
      - .github/workflows/apply-java17-parity-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: port/forge-1.19.2
          fetch-depth: 0

      - name: Apply Java 17 compatibility layer and parity suite
        shell: bash
        run: |
          set -euo pipefail
          base64 -d <<'PATCH' | gzip -d > /tmp/java17-tests.patch
          
          PATCH
          git apply --check /tmp/java17-tests.patch
          git apply /tmp/java17-tests.patch

      - name: Commit port fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java src/test/java
          git commit -m "port: add Java 17 bit operations and parity tests"
          git push origin HEAD:port/forge-1.19.2
