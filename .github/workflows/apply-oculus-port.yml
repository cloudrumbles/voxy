name: Apply Oculus shader integration

on:
  push:
    branches:
      - forge-1.19.2-shaders
    paths:
      - 'ci/oculus-port-chunk-*'
      - '.github/workflows/apply-oculus-port.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-oculus-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify and apply generated patch
        shell: bash
        run: |
          set -euo pipefail
          cat ci/oculus-port-chunk-* > /tmp/oculus-port.patch.gz.b64
          echo 'b13a57b548950b8c13778281b66e830730727f2b17dad6c64e0d2160960bc9c2  /tmp/oculus-port.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/oculus-port.patch.gz.b64 | gzip --decompress > /tmp/oculus-port.patch
          echo '1d3fcfe3abd52676268e3f57cba38a6d91ec251eaeb11e2af0f5447fd01c592d  /tmp/oculus-port.patch' | sha256sum -c -
          git apply --check /tmp/oculus-port.patch
          git apply --index /tmp/oculus-port.patch

      - name: Remove one-shot transport files
        shell: bash
        run: |
          set -euo pipefail
          git rm ci/oculus-port-chunk-* \
            .github/workflows/apply-oculus-port.yml \
            .github/workflows/export-shader-port-source.yml \
            .github/workflows/export-oculus-source.yml

      - name: Commit shader integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add Oculus 1.19.2 shader-pack integration'
          git push origin HEAD:forge-1.19.2-shaders
