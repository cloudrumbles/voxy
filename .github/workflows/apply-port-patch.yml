name: apply-port-patch

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/port.patch.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply queued port patch
        shell: bash
        run: |
          mkdir -p ci
          {
            set -euxo pipefail
            test -f ci/port.patch.ready
            compgen -G 'ci/port.patch.gz.b64.*' >/dev/null
            cat ci/port.patch.gz.b64.* | base64 --decode | gzip --decompress > ci/port.patch
            echo '0d59297bc8fe5abf901320ac913cd061705a43b6dce5a606eb26dc8746f94c04  ci/port.patch' | sha256sum --check
            git apply --check --whitespace=fix ci/port.patch
            git apply --index --whitespace=fix ci/port.patch
            git rm ci/port.patch.b64.* ci/port.patch.gz.b64.* ci/port.patch.ready
            rm ci/port.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'port: apply compiler-fix round'

            pushed=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:forge-1.19.2; then
                pushed=true
                break
              fi
              git fetch origin forge-1.19.2
              git rebase origin/forge-1.19.2
            done
            test "$pushed" = true

            git archive --format=zip --output=ci/patched-source.zip HEAD
          } 2>&1 | tee ci/apply.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit and parity tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean test 2>&1 | tee ci/test.log

      - name: Forge build and reobfuscation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon build jarJar 2>&1 | tee ci/build.log

      - name: Snapshot exact compile classpath
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon copyCompileClasspath 2>&1 | tee ci/classpath.log

      - name: Upload compiler iteration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-port-iteration-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ci/
            build/compile-classpath/
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
            build/libs/
