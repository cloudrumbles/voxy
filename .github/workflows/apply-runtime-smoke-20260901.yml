name: apply-runtime-smoke-20260901

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/apply-runtime-smoke-20260901.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-runtime-smoke-20260901
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Apply migration
        shell: bash
        run: python3 ci/apply-runtime-smoke-20260901.py

      - name: Verify compiler and packaging gates
        shell: bash
        run: ./gradlew --no-daemon clean test build jarJar

      - name: Commit the atomic migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/apply-runtime-smoke-20260901.py
          rm -f ci/apply-runtime-smoke-20260901.ready
          rm -f .github/workflows/apply-runtime-smoke-20260901.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: add deterministic Forge runtime validation'
          git push origin HEAD:forge-1.19.2

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apply-runtime-smoke-20260901-diagnostics
          if-no-files-found: warn
          path: |
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
            ci/
