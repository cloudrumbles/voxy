name: Apply packaged Oculus shader runtime harness

on:
  push:
    branches:
      - forge-1.19.2-shaders
    paths:
      - '.github/workflows/apply-shader-runtime-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: forge-1.19.2-shaders
      - name: Add optional Oculus mode to packaged-client harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ci/run-packaged-forge-smoke.sh')
          text = path.read_text()

          marker = 'SERVER_RUN_DIR="$ROOT_DIR/run-packaged-server"\n'
          insert = marker + '''\nSHADER_PACK_DIR="${VOXY_SMOKE_SHADER_PACK_DIR:-}"\nSHADER_PACK_NAME="${VOXY_SMOKE_SHADER_PACK_NAME:-}"\nSHADER_MODE=false\nif [[ -n "$SHADER_PACK_DIR" || -n "$SHADER_PACK_NAME" ]]; then\n    if [[ -z "$SHADER_PACK_DIR" || -z "$SHADER_PACK_NAME" ]]; then\n        echo "both VOXY_SMOKE_SHADER_PACK_DIR and VOXY_SMOKE_SHADER_PACK_NAME are required" >&2\n        exit 2\n    fi\n    SHADER_MODE=true\nfi\n'''
          if 'SHADER_PACK_DIR="${VOXY_SMOKE_SHADER_PACK_DIR:-}"' not in text:
              if marker not in text:
                  raise SystemExit('server run marker not found')
              text = text.replace(marker, insert, 1)

          mkdir_marker = '    "$CLIENT_RUN_DIR"\n\nmapfile -t voxy_jars'
          setup = '''    "$CLIENT_RUN_DIR"\n\nif [[ "$SHADER_MODE" == true ]]; then\n    if [[ ! -d "$SHADER_PACK_DIR/shaders" ]]; then\n        echo "shader pack checkout must contain a shaders directory: $SHADER_PACK_DIR" >&2\n        exit 2\n    fi\n    oculus_jar="$(find "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth/GchcoXML/Mw8aFpWF" -type f -name '*.jar' -print -quit 2>/dev/null || true)"\n    if [[ -z "$oculus_jar" || ! -f "$oculus_jar" ]]; then\n        echo "Oculus 1.6.9a compile artifact was not resolved by the main build" >&2\n        exit 2\n    fi\n    cp "$oculus_jar" "$CLIENT_PROJECT_DIR/libs/oculus-smoke-1.6.9a.jar"\n    mkdir -p "$CLIENT_RUN_DIR/shaderpacks" "$CLIENT_RUN_DIR/config"\n    rm -rf "$CLIENT_RUN_DIR/shaderpacks/$SHADER_PACK_NAME"\n    cp -a "$SHADER_PACK_DIR" "$CLIENT_RUN_DIR/shaderpacks/$SHADER_PACK_NAME"\n    cat > "$CLIENT_RUN_DIR/config/oculus.properties" <<OCULUS\nshaderPack=$SHADER_PACK_NAME\nenableShaders=true\nenableDebugOptions=false\ndisableUpdateMessage=true\nmaxShadowRenderDistance=32\ncolorSpace=SRGB\nOCULUS\nfi\n\nmapfile -t voxy_jars'''
          if 'Oculus 1.6.9a compile artifact was not resolved' not in text:
              if mkdir_marker not in text:
                  raise SystemExit('client mkdir marker not found')
              text = text.replace(mkdir_marker, setup, 1)

          phase_marker = "def isWorldPhase = smokePhase.startsWith('world-')\n"
          if "def useOculus = providers.gradleProperty('useOculus')" not in text:
              if phase_marker not in text:
                  raise SystemExit('gradle phase marker not found')
              text = text.replace(phase_marker,
                  phase_marker + "def useOculus = providers.gradleProperty('useOculus').orElse('false').get().toBoolean()\n", 1)

          dep_marker = "    implementation fg.deobf('local.voxy:voxy-smoke:0.2.14')\n"
          if "local.oculus:oculus-smoke:1.6.9a" not in text:
              if dep_marker not in text:
                  raise SystemExit('voxy dependency marker not found')
              text = text.replace(dep_marker,
                  dep_marker + "    if (useOculus) {\n        implementation fg.deobf('local.oculus:oculus-smoke:1.6.9a')\n    }\n", 1)

          phase_arg = '                -PsmokePhase="$phase" \\\n'
          if '-PuseOculus="$SHADER_MODE"' not in text:
              if phase_arg not in text:
                  raise SystemExit('smoke phase argument marker not found')
              text = text.replace(phase_arg,
                  phase_arg + '                -PuseOculus="$SHADER_MODE" \\\n', 1)

          validate_marker = '    validate_result "$result" "$phase"\n    cp "$result" "$REPORT_DIR/${name}.json"\n'
          validate_replace = '''    validate_result "$result" "$phase"\n    if [[ "$SHADER_MODE" == true ]]; then\n        if grep -Eqi 'Failed to create shader rendering pipeline|Shader compilation failed|Failed to parse preprocessed Voxy shader-pack metadata|Voxy shader requests missing Oculus' "$REPORT_DIR/${name}.log"; then\n            echo "shader pipeline failure detected for $SHADER_PACK_NAME" >&2\n            grep -Ein 'Failed to create shader rendering pipeline|Shader compilation failed|Failed to parse preprocessed Voxy shader-pack metadata|Voxy shader requests missing Oculus' "$REPORT_DIR/${name}.log" | tail -n 80 >&2 || true\n            return 1\n        fi\n        grep -Fq "Using shaderpack: $SHADER_PACK_NAME" "$REPORT_DIR/${name}.log"\n        grep -Fq 'External opaque Voxy shader patch applied' "$REPORT_DIR/${name}.log"\n        if [[ "$phase" == world-* ]]; then\n            grep -Fq "using pipeline 'IrisVoxyRenderPipeline'" "$REPORT_DIR/${name}.log"\n        fi\n    fi\n    cp "$result" "$REPORT_DIR/${name}.json"\n'''
          if "using pipeline 'IrisVoxyRenderPipeline'" not in text:
              if validate_marker not in text:
                  raise SystemExit('result validation marker not found')
              text = text.replace(validate_marker, validate_replace, 1)

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci/run-packaged-forge-smoke.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: add optional Oculus shader mode to packaged client'
          git push origin HEAD:forge-1.19.2-shaders
