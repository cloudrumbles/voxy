name: bootstrap-forge-1.19.2

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - .github/workflows/bootstrap-forge-1.19.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[bootstrap complete]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Import the audited Forge stepping-stone
        shell: bash
        run: |
          set -euo pipefail
          target="$PWD"
          git clone --depth 1 --branch forge-1.20.1 \
            https://github.com/guchang233/voxy-forge-1.20.1.git \
            /tmp/voxy-forge-1.20.1

          # Replace the Fabric/1.21+ build tree while retaining this repository's
          # workflow directory and Git metadata.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/voxy-forge-1.20.1/ "$target/"

      - name: Retarget the build to Minecraft 1.19.2 / Forge 43
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          props_path = Path("gradle.properties")
          props = props_path.read_text(encoding="utf-8")
          replacements = {
              "minecraft_version": "1.19.2",
              "forge_version": "43.5.2",
              "parchment_version": "2022.11.27",
              "parchment_minecraft_version": "1.19.2",
              "mod_version": "0.2.18-beta-forge-1.19.2",
              "archives_base_name": "voxy-forge-1.19.2",
              "java_version": "17",
          }
          for key, value in replacements.items():
              pattern = rf"(?m)^{re.escape(key)}=.*$"
              if re.search(pattern, props):
                  props = re.sub(pattern, f"{key}={value}", props)
              else:
                  props += f"\n{key}={value}\n"

          # Never bake a contributor's local JDK path into the branch.
          props = re.sub(r"(?m)^org\.gradle\.java\.installations\.paths=.*\n?", "", props)
          props_path.write_text(props, encoding="utf-8")

          build_path = Path("build.gradle")
          build = build_path.read_text(encoding="utf-8")
          build = build.replace(
              "minecraft_version_range: '[1.20.1,1.21)'",
              "minecraft_version_range: '[1.19.2,1.20)'",
          )
          build = build.replace(
              "forge_version_range : '[47,)'",
              "forge_version_range : '[43,)'",
          )
          build = build.replace(
              "loader_version_range: '[47,)'",
              "loader_version_range: '[43,)'",
          )

          junit_dependencies = """
              testImplementation platform('org.junit:junit-bom:5.10.3')
              testImplementation 'org.junit.jupiter:junit-jupiter'
              testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
          """
          marker = "    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'\n"
          if "org.junit.jupiter:junit-jupiter" not in build:
              if marker not in build:
                  raise SystemExit("Could not locate dependency insertion point")
              build = build.replace(marker, marker + junit_dependencies)

          test_config = """
          tasks.withType(Test).configureEach {
              useJUnitPlatform()
              maxHeapSize = '2G'
              testLogging {
                  events 'failed', 'skipped'
                  exceptionFormat 'full'
              }
          }

          """
          java_marker = "java {\n"
          if "useJUnitPlatform()" not in build:
              if java_marker not in build:
                  raise SystemExit("Could not locate test task insertion point")
              build = build.replace(java_marker, test_config + java_marker, 1)

          build_path.write_text(build, encoding="utf-8")

          Path("src/main/resources/pack.mcmeta").write_text(
              '{\n'
              '  "pack": {\n'
              '    "description": "Voxy resources",\n'
              '    "pack_format": 9\n'
              '  }\n'
              '}\n',
              encoding="utf-8",
          )

          mods = Path("src/main/resources/META-INF/mods.toml")
          mods_text = mods.read_text(encoding="utf-8")
          mods_text = mods_text.replace(
              "Ported to Forge 1.20.1 (third-party mod integrations disabled).",
              "Backported to Forge 1.19.2. Behaviour parity is enforced by the regression suite.",
          )
          mods.write_text(mods_text, encoding="utf-8")
          PY

      - name: Correct the Java 17 bit-compression compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          cat > src/main/java/me/cortex/voxy/common/util/IntBitOps.java <<'JAVA'
          package me.cortex.voxy.common.util;

          /**
           * Java 17 equivalents for the JDK bit-compress and bit-expand
           * operations used by the upstream Java 25 build.
           */
          public final class IntBitOps {
              private IntBitOps() {}

              /**
               * Packs the bits selected by {@code mask} into the least-significant
               * bits, preserving their low-to-high order.
               */
              public static int compress(int value, int mask) {
                  int result = 0;
                  int outputBit = 1;
                  for (int remaining = mask; remaining != 0; remaining &= remaining - 1) {
                      int selectedBit = remaining & -remaining;
                      if ((value & selectedBit) != 0) {
                          result |= outputBit;
                      }
                      outputBit <<= 1;
                  }
                  return result;
              }

              /**
               * Scatters the least-significant bits of {@code value} into the
               * positions selected by {@code mask}, preserving their order.
               */
              public static int expand(int value, int mask) {
                  int result = 0;
                  int inputBit = 1;
                  for (int remaining = mask; remaining != 0; remaining &= remaining - 1) {
                      int selectedBit = remaining & -remaining;
                      if ((value & inputBit) != 0) {
                          result |= selectedBit;
                      }
                      inputBit <<= 1;
                  }
                  return result;
              }
          }
          JAVA

      - name: Add deterministic parity and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/test/java/me/cortex/voxy/common/util
          mkdir -p src/test/java/me/cortex/voxy/common/world
          mkdir -p src/test/java/me/cortex/voxy/common/voxelization

          cat > src/test/java/me/cortex/voxy/common/util/IntBitOpsParityTest.java <<'JAVA'
          package me.cortex.voxy.common.util;

          import static org.junit.jupiter.api.Assertions.assertEquals;

          import java.util.Random;
          import org.junit.jupiter.api.Test;

          final class IntBitOpsParityTest {
              private static int referenceCompress(int value, int mask) {
                  int result = 0;
                  int target = 1;
                  for (int bit = 0; bit < Integer.SIZE; bit++) {
                      int source = 1 << bit;
                      if ((mask & source) != 0) {
                          if ((value & source) != 0) {
                              result |= target;
                          }
                          target <<= 1;
                      }
                  }
                  return result;
              }

              private static int referenceExpand(int value, int mask) {
                  int result = 0;
                  int source = 1;
                  for (int bit = 0; bit < Integer.SIZE; bit++) {
                      int target = 1 << bit;
                      if ((mask & target) != 0) {
                          if ((value & source) != 0) {
                              result |= target;
                          }
                          source <<= 1;
                      }
                  }
                  return result;
              }

              @Test
              void exhaustiveLowByteParity() {
                  for (int value = 0; value <= 0xff; value++) {
                      for (int mask = 0; mask <= 0xff; mask++) {
                          assertEquals(referenceCompress(value, mask), IntBitOps.compress(value, mask));
                          assertEquals(referenceExpand(value, mask), IntBitOps.expand(value, mask));
                      }
                  }
              }

              @Test
              void randomFullWidthParityAndRoundTrip() {
                  Random random = new Random(0x564f58594cL);
                  for (int sample = 0; sample < 100_000; sample++) {
                      int value = random.nextInt();
                      int mask = random.nextInt();

                      int compressed = IntBitOps.compress(value, mask);
                      int expanded = IntBitOps.expand(compressed, mask);

                      assertEquals(referenceCompress(value, mask), compressed);
                      assertEquals(referenceExpand(compressed, mask), expanded);
                      assertEquals(value & mask, expanded);
                  }
              }

              @Test
              void edgeCasesIncludeSignBitAndAllBits() {
                  int[] values = {0, -1, Integer.MIN_VALUE, Integer.MAX_VALUE, 0x55555555, 0xaaaaaaaa};
                  int[] masks = {0, -1, Integer.MIN_VALUE, Integer.MAX_VALUE, 0x55555555, 0xaaaaaaaa};

                  for (int value : values) {
                      for (int mask : masks) {
                          assertEquals(referenceCompress(value, mask), IntBitOps.compress(value, mask));
                          assertEquals(referenceExpand(value, mask), IntBitOps.expand(value, mask));
                      }
                  }
              }
          }
          JAVA

          cat > src/test/java/me/cortex/voxy/common/util/HierarchicalBitSetRegressionTest.java <<'JAVA'
          package me.cortex.voxy.common.util;

          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import java.util.BitSet;
          import java.util.Random;
          import org.junit.jupiter.api.Test;

          final class HierarchicalBitSetRegressionTest {
              @Test
              void allocatesLowestFreeSlotAndMaintainsBookkeeping() {
                  HierarchicalBitSet allocator = new HierarchicalBitSet(8_192);
                  BitSet model = new BitSet(8_192);
                  Random random = new Random(0x564f5859L);

                  for (int operation = 0; operation < 40_000; operation++) {
                      boolean allocate = model.isEmpty() || (model.cardinality() < 8_192 && random.nextBoolean());
                      if (allocate) {
                          int expected = model.nextClearBit(0);
                          int actual = allocator.allocateNext();
                          assertEquals(expected, actual);
                          model.set(actual);
                      } else {
                          int ordinal = random.nextInt(model.cardinality());
                          int index = model.nextSetBit(0);
                          while (ordinal-- > 0) {
                              index = model.nextSetBit(index + 1);
                          }
                          assertTrue(allocator.free(index));
                          assertFalse(allocator.free(index));
                          model.clear(index);
                      }

                      assertEquals(model.cardinality(), allocator.getCount());
                      assertEquals(model.length() - 1, allocator.getMaxIndex());
                  }
              }

              @Test
              void allocatesConsecutiveRangesAcrossWordBoundaries() {
                  HierarchicalBitSet allocator = new HierarchicalBitSet(4_096);
                  for (int i = 0; i < 60; i++) {
                      assertEquals(i, allocator.allocateNext());
                  }

                  int start = allocator.allocateNextConsecutiveCounted(16);
                  assertEquals(60, start);
                  for (int i = start; i < start + 16; i++) {
                      assertTrue(allocator.isSet(i));
                  }

                  for (int i = 62; i < 70; i++) {
                      assertTrue(allocator.free(i));
                  }

                  int replacement = allocator.allocateNextConsecutiveCounted(8);
                  assertEquals(62, replacement);
              }
          }
          JAVA

          cat > src/test/java/me/cortex/voxy/common/world/WorldCoordinateParityTest.java <<'JAVA'
          package me.cortex.voxy.common.world;

          import static org.junit.jupiter.api.Assertions.assertEquals;

          import java.util.Random;
          import org.junit.jupiter.api.Test;

          final class WorldCoordinateParityTest {
              @Test
              void sectionIndexMatchesUpstreamLayout() {
                  boolean[] seen = new boolean[WorldSection.SECTION_VOLUME];
                  for (int y = 0; y < 32; y++) {
                      for (int z = 0; z < 32; z++) {
                          for (int x = 0; x < 32; x++) {
                              int expected = (y << 10) | (z << 5) | x;
                              int actual = WorldSection.getIndex(x, y, z);
                              assertEquals(expected, actual);
                              seen[actual] = true;
                          }
                      }
                  }
                  for (boolean entry : seen) {
                      assertEquals(true, entry);
                  }
              }

              @Test
              void packedSectionCoordinatesRoundTripAtFormatBoundaries() {
                  int[] levels = {0, 1, 4, 15};
                  int[] horizontal = {-8_388_608, -1, 0, 1, 8_388_607};
                  int[] vertical = {-128, -1, 0, 1, 127};

                  for (int level : levels) {
                      for (int x : horizontal) {
                          for (int y : vertical) {
                              for (int z : horizontal) {
                                  long id = WorldEngine.getWorldSectionId(level, x, y, z);
                                  assertEquals(level, WorldEngine.getLevel(id));
                                  assertEquals(x, WorldEngine.getX(id));
                                  assertEquals(y, WorldEngine.getY(id));
                                  assertEquals(z, WorldEngine.getZ(id));
                              }
                          }
                      }
                  }
              }

              @Test
              void randomPackedCoordinatesRoundTrip() {
                  Random random = new Random(0x1192f043L);
                  for (int i = 0; i < 100_000; i++) {
                      int level = random.nextInt(16);
                      int x = random.nextInt(1 << 24) - (1 << 23);
                      int y = random.nextInt(256) - 128;
                      int z = random.nextInt(1 << 24) - (1 << 23);
                      long id = WorldEngine.getWorldSectionId(level, x, y, z);
                      assertEquals(level, WorldEngine.getLevel(id));
                      assertEquals(x, WorldEngine.getX(id));
                      assertEquals(y, WorldEngine.getY(id));
                      assertEquals(z, WorldEngine.getZ(id));
                  }
              }
          }
          JAVA

          cat > src/test/java/me/cortex/voxy/common/voxelization/VoxelizedSectionLayoutTest.java <<'JAVA'
          package me.cortex.voxy.common.voxelization;

          import static org.junit.jupiter.api.Assertions.assertEquals;

          import java.util.Arrays;
          import org.junit.jupiter.api.Test;

          final class VoxelizedSectionLayoutTest {
              @Test
              void levelOffsetsAndCapacityMatchUpstreamWireLayout() {
                  assertEquals(0, VoxelizedSection.getBaseIndexForLevel(0));
                  assertEquals(4_096, VoxelizedSection.getBaseIndexForLevel(1));
                  assertEquals(4_608, VoxelizedSection.getBaseIndexForLevel(2));
                  assertEquals(4_672, VoxelizedSection.getBaseIndexForLevel(3));
                  assertEquals(4_680, VoxelizedSection.getBaseIndexForLevel(4));
                  assertEquals(4_681, VoxelizedSection.createEmpty().section.length);
              }

              @Test
              void everyMipLevelUsesTheExpectedXzyIndexOrder() {
                  VoxelizedSection section = VoxelizedSection.createEmpty();
                  for (int i = 0; i < section.section.length; i++) {
                      section.section[i] = i;
                  }

                  for (int level = 0; level <= 4; level++) {
                      int side = 16 >> level;
                      int offset = VoxelizedSection.getBaseIndexForLevel(level);
                      for (int y = 0; y < side; y++) {
                          for (int z = 0; z < side; z++) {
                              for (int x = 0; x < side; x++) {
                                  int expected = offset + (y * side * side) + (z * side) + x;
                                  assertEquals(expected, section.get(level, x, y, z));
                              }
                          }
                      }
                  }
              }

              @Test
              void zeroClearsDataAndDerivedCount() {
                  VoxelizedSection section = VoxelizedSection.createEmpty();
                  Arrays.fill(section.section, 42L);
                  section.lvl0NonAirCount = 99;
                  section.zero();

                  assertEquals(0, section.lvl0NonAirCount);
                  for (long value : section.section) {
                      assertEquals(0L, value);
                  }
              }
          }
          JAVA

      - name: Add branch CI and port contract
        shell: bash
        run: |
          set -euo pipefail
          cat > PORTING.md <<'DOC'
          # Voxy Forge 1.19.2 port contract

          This branch backports Voxy to Minecraft 1.19.2 and Forge 43 while
          preserving the upstream storage formats, section-coordinate layouts,
          voxel/mip layouts, configuration defaults, and world lifecycle.

          The regression gate consists of:

          1. deterministic oracle tests for Java-version compatibility shims;
          2. model-based allocator tests;
          3. golden layout tests for world-section keys and voxel arrays;
          4. a Forge compile/reobfuscation/package check;
          5. a headless client startup smoke test that rejects Mixin application
             failures and confirms the mod reaches client setup.

          Loader- or Minecraft-version-specific code may change internally, but
          none of the above observable contracts may change without an explicit
          versioned migration and corresponding test update.

          The upstream licence remains in force. This branch does not publish
          binaries.
          DOC

          cat > .github/workflows/forge-1.19.2-ci.yml <<'YAML'
          name: forge-1.19.2-ci

          on:
            push:
              branches:
                - forge-1.19.2
            pull_request:
              branches:
                - dev
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            test-and-build:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - name: Check out sources
                  uses: actions/checkout@v4

                - name: Set up Java 17
                  uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: 17

                - name: Set up Gradle
                  uses: gradle/actions/setup-gradle@v4
                  with:
                    cache-read-only: ${{ github.event_name == 'pull_request' }}

                - name: Unit and parity tests
                  run: ./gradlew --no-daemon clean test

                - name: Forge build and reobfuscation
                  run: ./gradlew --no-daemon build jarJar

                - name: Verify packaged metadata
                  shell: bash
                  run: |
                    set -euo pipefail
                    jar_file="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
                    test -n "$jar_file"
                    jar tf "$jar_file" | grep -qx 'META-INF/mods.toml'
                    jar tf "$jar_file" | grep -qx 'client.voxy.mixins.json'
                    jar tf "$jar_file" | grep -qx 'client.voxy.refmap.json'
                    jar tf "$jar_file" | grep -qx 'META-INF/accesstransformer.cfg'
                    unzip -p "$jar_file" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
                    unzip -p "$jar_file" META-INF/mods.toml | grep -F '[43,)'

                - name: Upload test reports on failure
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: forge-1.19.2-test-reports
                    path: |
                      build/reports/tests/
                      build/test-results/
                      build/tmp/compileJava/
          YAML

          # The imported workflows target 1.20.1 and can publish binaries. They
          # must not run on this source-only backport branch.
          rm -f .github/workflows/check-does-build.yml
          rm -f .github/workflows/check-does-build-pr.yml
          rm -f .github/workflows/manual-artifact.yml

      - name: Commit the bootstrap result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "port: bootstrap Forge 1.19.2 backport [bootstrap complete]"
          git push origin HEAD:forge-1.19.2
