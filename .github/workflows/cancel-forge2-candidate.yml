name: cancel-forge2-candidate

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/cancel-forge2-candidate.ready
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cancel forge.2 validation and cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in validate-release-forge-1.19.2-v5.yml cleanup-forge-port-r3.yml; do
            for status in queued in_progress waiting pending; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --status "$status" --limit 50 --json databaseId \
                --jq '.[].databaseId' 2>/dev/null \
                | while read -r run_id; do
                    [[ -n "$run_id" ]] && gh run cancel --repo "$GITHUB_REPOSITORY" "$run_id" || true
                  done
            done
          done

      - name: Delete forge.2 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: forge-1.19.2-0.2.14-alpha-forge.2
        shell: bash
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true

      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Remove superseded definitions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forge-1.19.2
          git reset --hard origin/forge-1.19.2
          rm -f \
            .github/workflows/validate-release-forge-1.19.2-v5.yml \
            .github/workflows/cleanup-forge-port-r3.yml \
            ci/validate-release-forge-1.19.2-v5.ready \
            ci/cleanup-forge-port-r3.ready

      - name: Commit retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: retire source-set-only Forge candidate [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:forge-1.19.2; then
              exit 0
            fi
            git fetch origin forge-1.19.2
            git rebase origin/forge-1.19.2
            sleep $((attempt * 2))
          done
          exit 1
