name: capture-forge-release-failure

on:
  workflow_run:
    workflows:
      - validate-release-forge-1.19.2
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Capture failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          gh run view "$RUN_ID" --repo "${GITHUB_REPOSITORY}" --log-failed \
            2>&1 | tail -n 2500 > ci/validate-release-latest-failure.log

      - name: Publish concise diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci/validate-release-latest-failure.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: capture gated Forge candidate failure [skip ci]'
          git push origin HEAD:forge-1.19.2
