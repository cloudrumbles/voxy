name: Certify Oculus shader port (one-shot)

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - '.github/workflows/certify-oculus-shader-port.yml'

permissions:
  actions: read
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Wait for the shader matrix on the parent revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD^)"
          python3 - "$target_sha" <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.request

          target_sha = sys.argv[1]
          repository = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'voxy-shader-port-certifier',
          }

          def request_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          deadline = time.monotonic() + 22 * 60
          selected = None
          while time.monotonic() < deadline:
              runs = request_json(
                  f'https://api.github.com/repos/{repository}/actions/workflows/'
                  'forge-1.19.2-shader-smoke.yml/runs?branch=forge-1.19.2&per_page=20'
              )['workflow_runs']
              selected = next((run for run in runs if run['head_sha'] == target_sha), None)
              if selected and selected['status'] == 'completed':
                  break
              time.sleep(15)
          if not selected:
              raise SystemExit(f'no shader validation run found for {target_sha}')
          if selected['status'] != 'completed':
              raise SystemExit(f'shader validation did not complete for {target_sha}')
          if selected['conclusion'] != 'success':
              raise SystemExit(
                  f"shader validation {selected['id']} concluded {selected['conclusion']}"
              )

          jobs = request_json(selected['jobs_url'])['jobs']
          expected = {'photon', 'complementary_reimagined'}
          successful = {
              job['name'] for job in jobs
              if job['conclusion'] == 'success'
          }
          missing = expected - successful
          if missing:
              raise SystemExit('missing successful shader jobs: ' + ', '.join(sorted(missing)))

          with open('OCULUS_SHADER_RUNTIME_GREEN.json', 'w', encoding='utf-8') as output:
              json.dump({
                  'validated_sha': target_sha,
                  'workflow_run_id': selected['id'],
                  'workflow_url': selected['html_url'],
                  'successful_jobs': sorted(successful & expected),
              }, output, indent=2)
              output.write('\n')
          PY
      - name: Commit certification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name cloudrumbles
          git config user.email shahriyyah@gmail.com
          git pull --rebase origin forge-1.19.2
          git add OCULUS_SHADER_RUNTIME_GREEN.json
          git commit -m 'test: certify Photon and Complementary shader runtime'
          git push origin HEAD:forge-1.19.2
