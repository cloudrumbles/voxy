name: cleanup-forge-port-r3

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/cleanup-forge-port-r3.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cleanup-forge-port-r3
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait for final r3 validation record
        shell: bash
        run: |
          set -euo pipefail
          validation='https://github.com/cloudrumbles/voxy/releases/download/forge-1.19.2-0.2.14-alpha-forge.2/VALIDATION.txt'
          ready=false
          for _ in $(seq 1 720); do
            if curl --fail --location --silent --show-error "$validation" -o /tmp/VALIDATION.txt \
               && grep -Fq 'contract=forge-1.19.2-r3' /tmp/VALIDATION.txt; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true

      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Remove all completed staging machinery
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forge-1.19.2
          git reset --hard origin/forge-1.19.2

          find .github/workflows -maxdepth 1 -type f \
            ! -name 'forge-1.19.2-ci.yml' -delete

          find ci -maxdepth 1 -type f \( \
            -name '*.ready' -o \
            -name 'apply-*' -o \
            -name 'recover-*' -o \
            -name 'validate-release-*' -o \
            -name 'cancel-obsolete-*' -o \
            -name '*latest-failure*' \
          \) -delete

          test -f ci/run-forge-smoke.sh
          test -f src/main/java/me/cortex/voxy/client/VoxyClientSmoke.java
          test -f src/test/java/me/cortex/voxy/common/storage/NativeStorageDependencyTest.java
          grep -Fq 'RocksDB/LMDB are allowed to rotate WAL' ci/run-forge-smoke.sh
          grep -Fq 'forge-1.19.2-r3.' PORTING.md
          grep -Fq 'lwjglVoxyNatives' build.gradle

      - name: Commit clean PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: remove completed Forge port staging'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:forge-1.19.2; then
              exit 0
            fi
            git fetch origin forge-1.19.2
            git rebase origin/forge-1.19.2
            sleep $((attempt * 2))
          done
          exit 1
