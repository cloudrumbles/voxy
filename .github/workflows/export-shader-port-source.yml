name: Export shader-port source workspace

on:
  push:
    branches:
      - forge-1.19.2-shaders
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive source workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude=run -czf /tmp/voxy-shader-port-source.tar.gz .
          mv /tmp/voxy-shader-port-source.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: voxy-shader-port-source-${{ github.sha }}
          retention-days: 2
          if-no-files-found: error
          path: voxy-shader-port-source.tar.gz
