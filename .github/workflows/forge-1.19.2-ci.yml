name: forge-1.19.2-ci

on:
  push:
    branches:
      - forge-1.19.2
    paths-ignore:
      - 'ci/**'
      - '.github/workflows/apply-port-patch.yml'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit and parity tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew --no-daemon clean test 2>&1 | tee ci/test.log

      - name: Forge build and reobfuscation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon build jarJar 2>&1 | tee ci/build.log

      - name: Verify packaged metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'META-INF/mods.toml'
          jar tf "$jar_file" | grep -qx 'client.voxy.mixins.json'
          jar tf "$jar_file" | grep -qx 'client.voxy.refmap.json'
          jar tf "$jar_file" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "$jar_file" | grep -q '^me/cortex/voxy/client/core/VoxyRenderSystem.class$'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[43,)'
          if grep -R --line-number --fixed-strings 'VoxyRenderSystem (stub)' src/main/java; then
            echo 'stub renderer detected' >&2
            exit 1
          fi

      - name: Capture concise diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "# Forge 1.19.2 CI failure"
            echo
            echo "commit: ${GITHUB_SHA}"
            echo
            if [[ -f ci/test.log ]]; then
              tail -n 1600 ci/test.log
            elif [[ -f ci/build.log ]]; then
              tail -n 1600 ci/build.log
            else
              echo "No Gradle log was produced."
            fi
          } > ci/last-failure.log

      - name: Snapshot exact compile classpath
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          if ./gradlew --no-daemon tasks --all | grep -q 'copyCompileClasspath'; then
            ./gradlew --no-daemon copyCompileClasspath 2>&1 | tee ci/classpath.log
          fi

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ci/
            build/compile-classpath/
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/

      - name: Upload distributable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voxy-forge-1.19.2-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: build/libs/*-all.jar
