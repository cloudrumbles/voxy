name: forge-1.19.2-ci

on:
  push:
    branches:
      - forge-1.19.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit and parity tests
        run: ./gradlew --no-daemon clean test

      - name: Forge build and reobfuscation
        run: ./gradlew --no-daemon build jarJar

      - name: Verify packaged metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'META-INF/mods.toml'
          jar tf "$jar_file" | grep -qx 'client.voxy.mixins.json'
          jar tf "$jar_file" | grep -qx 'client.voxy.refmap.json'
          jar tf "$jar_file" | grep -qx 'META-INF/accesstransformer.cfg'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[43,)'

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-diagnostics
          path: |
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
