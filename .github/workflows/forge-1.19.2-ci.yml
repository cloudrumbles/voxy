name: forge-1.19.2-ci

on:
  push:
    branches:
      - forge-1.19.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-source-${{ github.run_id }}
          retention-days: 1
          include-hidden-files: true
          path: |
            .github/
            src/
            build.gradle
            gradle.properties
            settings.gradle
            gradlew
            gradlew.bat
            gradle/
            FUNCTIONAL_BASELINE.md
            PORTING.md
            README.md
            LICENSE.md

      - name: Check out native Forge 1.20.1 reference port
        uses: actions/checkout@v4
        with:
          repository: NHblock-Johnsnow/neo-voxy
          ref: multiversion
          path: ci/native-reference-repository
          fetch-depth: 1

      - name: Stage native Forge reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/native-reference-1.20.1
          cp -a ci/native-reference-repository/editions/forge-1.20.1-client/. ci/native-reference-1.20.1/
          rm -rf ci/native-reference-repository

      - name: Upload native Forge reference snapshot
        uses: actions/upload-artifact@v4
        with:
          name: voxy-native-forge-1.20.1-reference-${{ github.run_id }}
          retention-days: 1
          include-hidden-files: true
          path: ci/native-reference-1.20.1/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Capture Embeddium repository metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/dependency-metadata
          curl --fail --location --retry 3 \
            'https://maven.blamejared.com/org/embeddedt/embeddium-1.19.2/maven-metadata.xml' \
            --output ci/dependency-metadata/embeddium-1.19.2-maven-metadata.xml
          curl --fail --location --retry 3 \
            'https://maven.blamejared.com/org/embeddedt/embeddium-1.19.2/' \
            --output ci/dependency-metadata/embeddium-1.19.2-index.html

      - name: Unit and parity tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci
          ./gradlew --no-daemon clean test 2>&1 | tee ci/test.log

      - name: Preserve resolved renderer dependencies
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/dependencies
          for root in \
            "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth/sk9rgfiA" \
            "$HOME/.gradle/caches/modules-2/files-2.1/org.embeddedt/embeddium-1.19.2" \
            "$HOME/.gradle/caches/modules-2/files-2.1/org.joml/joml"; do
            if [[ -d "$root" ]]; then
              while IFS= read -r -d '' file; do
                name="$(basename "$file")"
                cp "$file" "ci/dependencies/${name}"
              done < <(find "$root" -type f -name '*.jar' -print0)
            fi
          done
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            cp "$file" "ci/dependencies/${name}"
          done < <(find build -type f \( -iname '*embeddium*.jar' -o -iname '*AYqEbec0*.jar' \) -print0 2>/dev/null || true)
          find ci/dependencies -maxdepth 1 -type f -printf '%f\n' | sort || true

      - name: Upload renderer dependency snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-renderer-dependencies-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            ci/dependencies/
            ci/dependency-metadata/

      - name: Forge build and reobfuscation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon build jarJar 2>&1 | tee ci/build.log

      - name: Verify packaged metadata
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'META-INF/mods.toml'
          jar tf "$jar_file" | grep -qx 'client.voxy.mixins.json'
          jar tf "$jar_file" | grep -qx 'client.voxy.refmap.json'
          jar tf "$jar_file" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "$jar_file" | grep -q '^me/cortex/voxy/client/core/VoxyRenderSystem.class$'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[43,)'
          if grep -R --line-number --fixed-strings 'VoxyRenderSystem (stub)' src/main/java; then
            echo 'stub renderer detected' >&2
            exit 1
          fi

      - name: Publish concise failure diagnostics
        if: failure() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "# Forge 1.19.2 CI failure"
            echo
            echo "commit: ${GITHUB_SHA}"
            echo
            if [[ -f ci/test.log ]]; then
              tail -n 1200 ci/test.log
            elif [[ -f ci/build.log ]]; then
              tail -n 1200 ci/build.log
            else
              echo "No Gradle log was produced."
            fi
          } > ci/last-failure.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ci/last-failure.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: capture latest Forge diagnostics [skip ci]'
          git push

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-diagnostics
          if-no-files-found: error
          path: |
            ci/
            build/reports/tests/
            build/test-results/
            build/tmp/compileJava/
