name: Forge 1.19.2 packaged client validation

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'src/**'
      - 'ci/run-packaged-forge-smoke.sh'
      - 'ci/validate-packaged-jar.py'
      - 'ci/validate-packaged-results.py'
      - '.github/workflows/forge-1.19.2-runtime-smoke.yml'
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-1.19.2-packaged-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # Ubuntu's llvmpipe advertises GLSL 4.50 by default even when its OpenGL
      # context is overridden to 4.6. Voxy's shaders declare GLSL 4.60.
      MESA_GLSL_VERSION_OVERRIDE: '460'

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install software OpenGL and client native runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 flite1-dev

      - name: Build, test, and reobfuscate
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew ci/run-packaged-forge-smoke.sh ci/validate-packaged-jar.py ci/validate-packaged-results.py
          ./gradlew --no-daemon clean test jarJar 2>&1 | tee ci/packaged-build.log

      - name: Verify packaged runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jar_files < <(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print | sort)
          if [[ "${#jar_files[@]}" -ne 1 ]]; then
            printf 'expected exactly one distributable JAR, found %s\n' "${#jar_files[@]}" >&2
            exit 1
          fi
          python3 ci/validate-packaged-jar.py "${jar_files[0]}" | tee ci/packaged-jar-validation.txt

      - name: Validate the installed packaged client
        shell: bash
        env:
          # Installed jars carry SRG refmaps. ForgeGradle's userdev runtime uses
          # official names, so Mixin translates those references through the
          # mapping file generated by the isolated validation client.
          JAVA_TOOL_OPTIONS: >-
            -Dmixin.env.remapRefMap=true
            -Dmixin.env.refMapRemappingFile=${{ github.workspace }}/build/packaged-smoke-client-project/build/createSrgToMcp/output.srg
            -Dembeddium.enableGameTest=false
            -Dembeddium.runAutomatedTests=false
        run: bash ci/run-packaged-forge-smoke.sh

      - name: Require completed validation contract
        shell: bash
        run: |
          test -s ci/packaged-runtime-smoke/SUCCESS
          python3 ci/validate-packaged-results.py ci/packaged-runtime-smoke

      - name: Upload packaged JAR and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voxy-forge-1.19.2-client-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/libs/*-all.jar
            ci/packaged-build.log
            ci/packaged-jar-validation.txt
            ci/packaged-runtime-smoke/
            run-packaged-client/logs/
            run-packaged-client/crash-reports/
            run-packaged-client/voxy-smoke-*.json
            run-packaged-client/.voxy/
            run-packaged-server/logs/
            run-packaged-server/crash-reports/
