name: Forge 1.19.2 packaged client validation

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'src/**'
      - 'ci/run-forge-smoke.sh'
      - 'ci/run-packaged-forge-smoke.sh'
      - '.github/workflows/forge-1.19.2-runtime-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-1.19.2-packaged-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install software OpenGL runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0

      - name: Build, test, and reobfuscate
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew ci/run-forge-smoke.sh ci/run-packaged-forge-smoke.sh
          ./gradlew --no-daemon clean test jarJar 2>&1 | tee ci/packaged-build.log

      - name: Validate the installed packaged client
        shell: bash
        run: bash ci/run-packaged-forge-smoke.sh

      - name: Require completed validation contract
        shell: bash
        run: test -s ci/packaged-runtime-smoke/SUCCESS

      - name: Upload packaged jar and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxy-forge-1.19.2-client-validation-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/libs/*-all.jar
            ci/packaged-build.log
            ci/packaged-runtime-smoke/
            run-packaged-client/logs/
            run-packaged-client/crash-reports/
            run-packaged-client/voxy-smoke-*.json
            run-packaged-client/.voxy/
            run-packaged-server/logs/
            run-packaged-server/crash-reports/
