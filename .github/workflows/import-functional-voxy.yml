name: import-functional-voxy

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - .github/workflows/import-functional-voxy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Forge port branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Fetch the last functional Java 17 renderer lineage
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch mc_1201-java17-3.3.1 \
            https://github.com/m3t4f1v3/voxy.git \
            /tmp/functional-voxy

      - name: Replace the stubbed source tree without losing Forge scaffolding
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/forge-overlay/META-INF
          cp src/main/java/me/cortex/voxy/client/VoxyMod.java /tmp/forge-overlay/VoxyMod.java
          cp src/main/java/me/cortex/voxy/common/util/IntBitOps.java /tmp/forge-overlay/IntBitOps.java
          cp src/main/resources/META-INF/mods.toml /tmp/forge-overlay/META-INF/mods.toml
          cp src/main/resources/META-INF/accesstransformer.cfg /tmp/forge-overlay/META-INF/accesstransformer.cfg
          cp src/main/resources/pack.mcmeta /tmp/forge-overlay/pack.mcmeta

          rm -rf src/main/java src/main/resources
          mkdir -p src/main
          cp -a /tmp/functional-voxy/src/main/java src/main/java
          cp -a /tmp/functional-voxy/src/main/resources src/main/resources

          mkdir -p src/main/java/me/cortex/voxy/client
          mkdir -p src/main/java/me/cortex/voxy/common/util
          mkdir -p src/main/resources/META-INF
          cp /tmp/forge-overlay/VoxyMod.java src/main/java/me/cortex/voxy/client/VoxyMod.java
          cp /tmp/forge-overlay/IntBitOps.java src/main/java/me/cortex/voxy/common/util/IntBitOps.java
          cp /tmp/forge-overlay/META-INF/mods.toml src/main/resources/META-INF/mods.toml
          cp /tmp/forge-overlay/META-INF/accesstransformer.cfg src/main/resources/META-INF/accesstransformer.cfg
          cp /tmp/forge-overlay/pack.mcmeta src/main/resources/pack.mcmeta

          rm -f src/main/resources/fabric.mod.json
          rm -f src/main/resources/voxy.accesswidener

          cat > FUNCTIONAL_BASELINE.md <<'DOC'
          # Functional backport baseline

          The rendering, meshing, model-baking, world-ingest, persistence, and
          shader source tree on this branch comes from Voxy 0.2.14-alpha branch
          `m3t4f1v3/voxy:mc_1201-java17-3.3.1`.

          That branch is the last known Java 17 / Minecraft 1.20.1 lineage with
          the complete direct-LWJGL renderer and is also the source used by the
          independently working Boxy Forge 1.20.1 compatibility project.

          The earlier `guchang233/voxy-forge-1.20.1` import was rejected as a
          behavioural baseline because it replaced Voxy's renderer with a log-only
          stub. Its final state is retained only on `forge-1.19.2-stub-reference`.

          Loader integration is being rewritten for Forge 43/Minecraft 1.19.2;
          stable core formats and algorithms are guarded by the regression suite.
          DOC

      - name: Commit functional source lineage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main FUNCTIONAL_BASELINE.md
          git commit -m "port: restore functional Voxy 0.2.14 renderer lineage"
          git push origin HEAD:forge-1.19.2
