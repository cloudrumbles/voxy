name: port-forge-1.19.2-ci

on:
  push:
    branches:
      - port/forge-1.19.2
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit, parity, and packaging tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci
          ./gradlew --no-daemon clean test build 2>&1 | tee build/ci/gradle.log

      - name: Verify Forge metadata and complete renderer
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'META-INF/mods.toml'
          jar tf "$jar_file" | grep -qx 'client.voxy.mixins.json'
          jar tf "$jar_file" | grep -qx 'common.voxy.mixins.json'
          jar tf "$jar_file" | grep -q '^me/cortex/voxy/client/core/VoxyRenderSystem.class$'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
          unzip -p "$jar_file" META-INF/mods.toml | grep -F '[43,)'
          if grep -R --line-number --fixed-strings 'VoxyRenderSystem (stub)' src/main/java; then
            echo 'stub renderer detected' >&2
            exit 1
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-diagnostics
          if-no-files-found: ignore
          path: |
            build/ci/
            build/reports/
            build/test-results/
            build/tmp/

      - name: Upload development artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voxy-forge-1.19.2
          if-no-files-found: error
          path: build/libs/*.jar
