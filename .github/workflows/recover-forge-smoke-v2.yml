name: recover-forge-smoke-v2

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/recover-forge-smoke-v2.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-forge-smoke-v2
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Apply corrected persistence semantics if still needed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin forge-1.19.2
          git reset --hard origin/forge-1.19.2
          if ! grep -Fq 'RocksDB/LMDB are allowed to rotate WAL' ci/run-forge-smoke.sh; then
            test -f ci/run-forge-smoke-v2.sh
            cp ci/run-forge-smoke-v2.sh ci/run-forge-smoke.sh
            chmod +x ci/run-forge-smoke.sh
          fi
          rm -f ci/run-forge-smoke-v2.sh
          rm -f ci/apply-forge-smoke-v2.ready
          rm -f ci/recover-forge-smoke-v2.ready

      - name: Commit against current head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: validate persistence semantics across Forge restart'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:forge-1.19.2; then
              exit 0
            fi
            git fetch origin forge-1.19.2
            git rebase origin/forge-1.19.2
            sleep $((attempt * 2))
          done
          exit 1
