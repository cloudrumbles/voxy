name: recover-runtime-smoke-20260901

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/recover-runtime-smoke-20260901.ready
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-runtime-smoke-20260901
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Apply only when the migration is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f src/main/java/me/cortex/voxy/client/VoxyClientSmoke.java ]] \
             || ! grep -Fq 'Forge runtime smoke tests' .github/workflows/forge-1.19.2-ci.yml; then
            test -f ci/apply-runtime-smoke-20260901.py
            python3 ci/apply-runtime-smoke-20260901.py
          fi

      - name: Commit a clean source state
        shell: bash
        run: |
          set -euo pipefail
          rm -f ci/apply-runtime-smoke-20260901.py
          rm -f ci/apply-runtime-smoke-20260901.ready
          rm -f ci/recover-runtime-smoke-20260901.ready
          rm -f .github/workflows/apply-runtime-smoke-20260901.yml
          rm -f .github/workflows/recover-runtime-smoke-20260901.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: add deterministic Forge runtime validation'
          git push origin HEAD:forge-1.19.2
