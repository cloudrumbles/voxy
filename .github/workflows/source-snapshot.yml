name: source-snapshot

on:
  push:
    branches:
      - port/forge-1.19.2
    paths:
      - .github/workflows/source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: git archive --format=tar.gz --output=voxy-source.tar.gz HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: voxy-source
          path: voxy-source.tar.gz
          if-no-files-found: error
