name: validate-release-forge-1.19.2-v3

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/validate-release-forge-1.19.2-v3.ready
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: validate-release-forge-1.19.2-v3
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Wait for corrected smoke invariant and pin branch head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 180); do
            git fetch origin forge-1.19.2
            git reset --hard origin/forge-1.19.2
            if grep -Fq 'RocksDB/LMDB are allowed to rotate WAL' ci/run-forge-smoke.sh; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install software OpenGL dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-utils

      - name: Unit tests, Forge build, and reobfuscation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci/release-validation
          ./gradlew --no-daemon clean test build jarJar 2>&1 | tee ci/release-validation/gradle.log

      - name: Runtime smoke validation
        shell: bash
        run: |
          set -o pipefail
          bash ci/run-forge-smoke.sh 2>&1 | tee ci/release-validation/runtime.log

      - name: Verify and name distributable
        env:
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          source_jar="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$source_jar"
          output='ci/release-validation/voxy-forge-1.19.2-0.2.14-alpha-forge.1.jar'
          cp "$source_jar" "$output"
          jar tf "$output" | grep -qx 'META-INF/mods.toml'
          jar tf "$output" | grep -qx 'client.voxy.mixins.json'
          jar tf "$output" | grep -qx 'client.voxy.refmap.json'
          jar tf "$output" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "$output" | grep -qx 'me/cortex/voxy/client/core/VoxyRenderSystem.class'
          unzip -p "$output" META-INF/mods.toml | grep -F '[1.19.2,1.20)'
          unzip -p "$output" META-INF/mods.toml | grep -F '[43,)'
          sha256sum "$output" | tee ci/release-validation/SHA256SUMS
          {
            echo "commit=$VALIDATED_SHA"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
            echo "runtime_smoke=title,world,restart,oculus-shaders"
          } > ci/release-validation/VALIDATION.txt
          cp -a ci/runtime-smoke ci/release-validation/runtime-smoke

      - name: Publish validated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: forge-1.19.2-0.2.14-alpha-forge.1
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          git tag -f "$TAG" "$VALIDATED_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release create "$TAG" \
            --title 'Voxy Forge 1.19.2 — 0.2.14 alpha candidate 1' \
            --notes 'Validated on Java 17 with parity tests, Forge reobfuscation/package checks, a title-screen launch, two world launches against the same nonempty persistence store, and Oculus with an enabled minimal shader pack.' \
            --prerelease \
            ci/release-validation/voxy-forge-1.19.2-0.2.14-alpha-forge.1.jar \
            ci/release-validation/SHA256SUMS \
            ci/release-validation/VALIDATION.txt

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/release-validation
          {
            echo "validated_head=${{ steps.source.outputs.sha }}"
            echo "failed_step=${{ job.status }}"
            echo
            for log in ci/release-validation/gradle.log ci/release-validation/runtime.log; do
              if [[ -f "$log" ]]; then
                echo "===== $log ====="
                tail -n 1200 "$log"
              fi
            done
          } > ci/release-validation/FAILURE.txt

      - name: Upload complete validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-release-validation-v3-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci/release-validation/
            ci/runtime-smoke/
            build/reports/tests/
            build/test-results/
