name: validate-release-forge-1.19.2-v5

on:
  push:
    branches:
      - forge-1.19.2
    paths:
      - ci/validate-release-forge-1.19.2-v5.ready
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: validate-release-forge-1.19.2-v5
  cancel-in-progress: false

jobs:
  validate-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: forge-1.19.2
          fetch-depth: 0

      - name: Wait for final storage/runtime contract and pin head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for _ in $(seq 1 360); do
            git fetch origin forge-1.19.2
            git reset --hard origin/forge-1.19.2
            if grep -Fq 'RocksDB/LMDB are allowed to rotate WAL' ci/run-forge-smoke.sh \
               && grep -Fq 'forge-1.19.2-r3.' PORTING.md \
               && grep -Fq 'lwjglVoxyNatives' build.gradle \
               && grep -Fq "config 'common.voxy.mixins.json'" build.gradle \
               && grep -Fq 'modId="embeddium"' src/main/resources/META-INF/mods.toml \
               && test -f src/test/java/me/cortex/voxy/common/storage/NativeStorageDependencyTest.java; then
              ready=true
              break
            fi
            sleep 10
          done
          test "$ready" = true
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install software OpenGL dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb mesa-utils

      - name: Unit tests, Forge build, and reobfuscation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci/release-validation
          ./gradlew --no-daemon clean test build jarJar 2>&1 | tee ci/release-validation/gradle.log

      - name: Runtime smoke validation
        shell: bash
        run: |
          set -o pipefail
          bash ci/run-forge-smoke.sh 2>&1 | tee ci/release-validation/runtime.log

      - name: Verify packaged runtime and native contract
        env:
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          source_jar="$(find build/libs -maxdepth 1 -type f -name '*-all.jar' -print -quit)"
          test -n "$source_jar"
          output='ci/release-validation/voxy-forge-1.19.2-0.2.14-alpha-forge.2.jar'
          cp "$source_jar" "$output"

          jar tf "$output" | grep -qx 'META-INF/mods.toml'
          jar tf "$output" | grep -qx 'client.voxy.mixins.json'
          jar tf "$output" | grep -qx 'common.voxy.mixins.json'
          jar tf "$output" | grep -qx 'client.voxy.refmap.json'
          jar tf "$output" | grep -qx 'META-INF/accesstransformer.cfg'
          jar tf "$output" | grep -qx 'me/cortex/voxy/client/core/VoxyRenderSystem.class'
          jar tf "$output" | grep -Eq '(^|/)liblwjgl_lmdb\.so$|(^|/)lwjgl_lmdb\.dll$'
          jar tf "$output" | grep -Eq '(^|/)liblwjgl_zstd\.so$|(^|/)lwjgl_zstd\.dll$'
          jar tf "$output" | grep -qx 'META-INF/jarjar/metadata.json'

          unzip -p "$output" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'client.voxy.mixins.json'
          unzip -p "$output" META-INF/MANIFEST.MF | tr -d '\r' | grep -F 'common.voxy.mixins.json'
          unzip -p "$output" META-INF/mods.toml > ci/release-validation/mods.toml
          unzip -p "$output" META-INF/jarjar/metadata.json > ci/release-validation/jarjar-metadata.json

          python3 - <<'PYTHON'
          import json
          import tomllib
          from pathlib import Path

          mods = tomllib.loads(Path('ci/release-validation/mods.toml').read_text())
          dependencies = mods.get('dependencies', {}).get('voxy', [])
          by_id = {entry.get('modId'): entry for entry in dependencies}
          embeddium = by_id.get('embeddium')
          assert embeddium is not None
          assert embeddium.get('mandatory') is True
          assert embeddium.get('side') == 'CLIENT'
          oculus = by_id.get('oculus')
          assert oculus is not None
          assert oculus.get('mandatory') is False
          assert oculus.get('side') == 'CLIENT'

          metadata_text = Path('ci/release-validation/jarjar-metadata.json').read_text()
          metadata = json.loads(metadata_text)
          assert 'rocksdbjni' in metadata_text and '10.2.1' in metadata_text
          assert 'sqlite-jdbc' in metadata_text and '3.49.1.0' in metadata_text
          assert 'lwjgl-lmdb' in metadata_text
          assert 'lwjgl-zstd' in metadata_text
          assert metadata
          PYTHON

          grep -F '[1.19.2,1.20)' ci/release-validation/mods.toml
          grep -F '[43,)' ci/release-validation/mods.toml
          sha256sum "$output" | tee ci/release-validation/SHA256SUMS
          {
            echo "commit=$VALIDATED_SHA"
            echo "contract=forge-1.19.2-r3"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo "gradle=$(./gradlew --version | awk '/^Gradle / {print $2; exit}')"
            echo "rocksdb=10.2.1"
            echo "sqlite=3.49.1.0"
            echo "lwjgl_natives=lmdb,zstd;windows-x86_64,linux-x86_64"
            echo "runtime_smoke=title,world,restart,oculus-shaders"
          } > ci/release-validation/VALIDATION.txt
          cp -a ci/runtime-smoke ci/release-validation/runtime-smoke

      - name: Publish validated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: forge-1.19.2-0.2.14-alpha-forge.2
          VALIDATED_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          git tag -f "$TAG" "$VALIDATED_SHA"
          git push --force origin "refs/tags/$TAG"
          gh release create "$TAG" \
            --title 'Voxy Forge 1.19.2 — 0.2.14 alpha candidate 2' \
            --notes 'Validated on Java 17 with data-layout and native-storage tests, Forge reobfuscation/package checks, explicit Embeddium and mixin metadata, bundled LMDB/Zstd natives, a title-screen launch, two world launches against the same nonempty persistence store, and Oculus with an enabled minimal shader pack.' \
            --prerelease \
            ci/release-validation/voxy-forge-1.19.2-0.2.14-alpha-forge.2.jar \
            ci/release-validation/SHA256SUMS \
            ci/release-validation/VALIDATION.txt

      - name: Ensure pull request exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --head forge-1.19.2 --base dev --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create \
              --head forge-1.19.2 \
              --base dev \
              --title 'Port Voxy 0.2.14 to Forge 1.19.2' \
              --body-file - <<'BODY'
          ## Port scope

          This ports the functional Voxy 0.2.14 renderer and world engine to Minecraft 1.19.2, Forge 43.5.2, and Java 17. Fabric loader, lifecycle, command, configuration, and renderer hooks are replaced with native Forge equivalents; the renderer targets modernized Embeddium 1.19.2; native storage dependencies are packaged through Forge JarJar.

          ## Regression gates

          - Java 17 parity tests for coordinate packing, voxel/mip layouts, allocator behaviour, and import-manager concurrency
          - RocksDB and SQLite durable round-trip/reopen tests
          - packaged Windows/Linux LMDB and Zstd native verification
          - ForgeGradle compile, reobfuscation, dependency metadata, and both-mixin manifest checks
          - real client launch to the title screen under Mesa software OpenGL
          - connection to a local Forge server with a live Voxy renderer
          - clean shutdown and second launch against nonempty persisted Voxy data
          - Oculus loaded with an enabled minimal shader pack while the Voxy renderer remains live
          BODY
          fi

      - name: Write failure summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/release-validation
          {
            echo "validated_head=${{ steps.source.outputs.sha }}"
            echo "contract=forge-1.19.2-r3"
            for log in ci/release-validation/gradle.log ci/release-validation/runtime.log; do
              if [[ -f "$log" ]]; then
                echo "===== $log ====="
                tail -n 1800 "$log"
              fi
            done
          } > ci/release-validation/FAILURE.txt

      - name: Upload complete validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-1.19.2-release-validation-v5-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ci/release-validation/
            ci/runtime-smoke/
            build/reports/tests/
            build/test-results/
