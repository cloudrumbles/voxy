buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

sourceSets {
    main {
        java {
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'
            exclude 'me/cortex/voxy/commonImpl/mixin/chunky/MixinFabricWorld.java'
        }
    }
}

configurations {
    lwjglLmdbNatives {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The modernized 1.19.2 Embeddium line exposes the Sodium 0.5 renderer API
    // used by this backport.
    implementation fg.deobf("org.embeddedt:embeddium-1.19.2:${embeddium_version}")

    // Oculus 1.6.9a is built against Mojang's official mappings already.
    // Do not run it through fg.deobf: ForgeGradle would request a synthetic
    // *_mapped_official_1.19.2 classifier that Modrinth does not publish.
    compileOnly("maven.modrinth:GchcoXML:Mw8aFpWF") {
        transitive = false
    }

    // Minecraft 1.19.2 and the selected Embeddium build use JOML 1.10.5.
    compileOnly 'org.joml:joml:1.10.5'

    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")) {
        transitive = false
        jarJar.pin(it, mixin_extras_version)
        jarJar.ranged(it, "[${mixin_extras_version}]")
    }

    compileOnly 'org.lwjgl:lwjgl:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-lmdb:3.3.1'
    implementation(jarJar('org.lwjgl:lwjgl-lmdb:3.3.1')) {
        transitive = false
        jarJar.pin(it, '3.3.1')
        jarJar.ranged(it, '[3.3.1]')
    }
    lwjglLmdbNatives 'org.lwjgl:lwjgl-lmdb:3.3.1:natives-linux'
    lwjglLmdbNatives 'org.lwjgl:lwjgl-lmdb:3.3.1:natives-windows'

    implementation(jarJar('com.github.luben:zstd-jni:1.5.7-16')) {
        transitive = false
        jarJar.pin(it, '1.5.7-16')
        jarJar.ranged(it, '[1.5.7-16]')
    }

    implementation(jarJar('org.rocksdb:rocksdbjni:10.2.1')) {
        transitive = false
        jarJar.pin(it, '10.2.1')
        jarJar.ranged(it, '[10.2.1]')
    }
    implementation(jarJar('redis.clients:jedis:5.1.0')) {
        transitive = false
        jarJar.pin(it, '5.1.0')
        jarJar.ranged(it, '[5.1.0]')
    }
    implementation(jarJar('org.apache.commons:commons-pool2:2.12.0')) {
        transitive = false
        jarJar.pin(it, '2.12.0')
        jarJar.ranged(it, '[2.12.0]')
    }
    implementation(jarJar('at.yawk.lz4:lz4-java:1.8.1')) {
        transitive = false
        jarJar.pin(it, '1.8.1')
        jarJar.ranged(it, '[1.8.1]')
    }
    implementation(jarJar('org.tukaani:xz:1.10')) {
        transitive = false
        jarJar.pin(it, '1.10')
        jarJar.ranged(it, '[1.10]')
    }
    implementation(jarJar('org.xerial:sqlite-jdbc:3.49.1.0')) {
        transitive = false
        jarJar.pin(it, '3.49.1.0')
        jarJar.ranged(it, '[3.49.1.0]')
    }

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion '3.3.1'
        }
        if (details.requested.group == 'org.joml') {
            details.useVersion '1.10.5'
        }
        if (details.requested.group == 'com.google.code.gson'
                && details.requested.name == 'gson') {
            details.useVersion '2.8.9'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : '[1.19.2,1.20)',
            forge_version           : forge_version,
            forge_version_range     : '[43,)',
            loader_version_range    : '[43,)',
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
    options.deprecation = true
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

tasks.named('jarJar').configure {
    enabled = true
    from("${buildDir}/tmp/compileJava/compileJava-refmap.json") {
        rename { 'client.voxy.refmap.json' }
    }
    from({ project.configurations.lwjglLmdbNatives.collect { project.zipTree(it) } }) {
        include 'linux/x64/org/lwjgl/lmdb/liblwjgl_lmdb.so'
        include 'windows/x64/org/lwjgl/lmdb/lwjgl_lmdb.dll'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    dependsOn(tasks.compileJava)
}

mixin {
    add sourceSets.main, 'client.voxy.refmap.json'
    config 'common.voxy.mixins.json'
    config 'client.voxy.mixins.json'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('LICENSE.md') {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'    : project.archives_base_name,
                'Specification-Vendor'   : 'Cortex',
                'Specification-Version'  : project.mod_version,
                'Implementation-Title'   : project.archives_base_name,
                'Implementation-Version' : project.mod_version,
                'Implementation-Vendor'  : 'Cortex'
        ])
    }
}

tasks.register('copyCompileClasspath', Copy) {
    from configurations.compileClasspath
    into layout.buildDirectory.dir('compile-classpath')
}
