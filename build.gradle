buildscript {
    repositories {
        mavenLocal()
        maven { url = 'https://mirrors.huaweicloud.com/repository/maven/' }
        maven { url = 'https://mirrors.cloud.tencent.com/maven/' }
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.54'
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

sourceSets {
    main {
        java {
            // Oculus 1.19.2 uses the old net.coderbot Iris API. Keep shader
            // integration out of this core backport until it has its own port.
            exclude 'me/cortex/voxy/client/iris/**'
            exclude 'me/cortex/voxy/client/mixin/iris/**'
            exclude 'me/cortex/voxy/client/mixin/nvidium/**'
            exclude 'me/cortex/voxy/client/core/IrisVoxyRenderPipeline.java'
            exclude 'me/cortex/voxy/commonImpl/mixin/chunky/MixinFabricWorld.java'
        }
    }
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-XX:-UseContainerSupport'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                voxy {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://mirrors.huaweicloud.com/repository/maven/' }
    maven { url = 'https://mirrors.cloud.tencent.com/repository/maven/' }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.florens.be' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.parchmentmc.org/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // The modernized 1.19.2 Embeddium line exposes the Sodium 0.5 renderer API
    // used by this backport.
    implementation fg.deobf("org.embeddedt:embeddium-1.19.2:${embeddium_version}")

    if (project.hasProperty('runtimeSmoke')) {
        runtimeOnly fg.deobf('be.florens:autoload-forge:1.1.3')
    }

    compileOnly 'org.joml:joml:1.10.5'

    compileOnly "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:${mixin_extras_version}"
    jarJar(implementation("io.github.llamalad7:mixinextras-forge:[${mixin_extras_version},0.6)")) {
        version { strictly "[${mixin_extras_version},0.6)"; prefer mixin_extras_version }
    }

    // Minecraft 1.19.2 supplies LWJGL core 3.3.1. LMDB is the only optional
    // LWJGL binding retained here; Zstandard uses zstd-jni below so it carries
    // the native runtime ordinary Minecraft installations do not provide.
    compileOnly 'org.lwjgl:lwjgl:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-lmdb:3.3.1'
    jarJar(implementation('org.lwjgl:lwjgl-lmdb:[3.3.1,4.0)')) {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        version { strictly '[3.3.1,4.0)'; prefer '3.3.1' }
    }

    implementation(jarJar('com.github.luben:zstd-jni:1.5.7-16')) {
        transitive = false
        jarJar.pin(it, '1.5.7-16')
        jarJar.ranged(it, '[1.5.7-16]')
    }

    jarJar(implementation('org.rocksdb:rocksdbjni:[7.10.2,8.0)')) {
        version { strictly '[7.10.2,8.0)'; prefer '7.10.2' }
    }
    jarJar(implementation('redis.clients:jedis:[5.1.0,6.0)')) {
        version { strictly '[5.1.0,6.0)'; prefer '5.1.0' }
    }
    jarJar(implementation('org.apache.commons:commons-pool2:[2.12.0,3.0)')) {
        version { strictly '[2.12.0,3.0)'; prefer '2.12.0' }
    }
    jarJar(implementation('at.yawk.lz4:lz4-java:[1.8.1,2.0)')) {
        version { strictly '[1.8.1,2.0)'; prefer '1.8.1' }
    }
    jarJar(implementation('org.tukaani:xz:[1.10,2.0)')) {
        version { strictly '[1.10,2.0)'; prefer '1.10' }
    }
    jarJar(implementation('org.xerial:sqlite-jdbc:[3.42.0.0,4.0)')) {
        version { strictly '[3.42.0.0,4.0)'; prefer '3.42.0.0' }
    }

    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl') {
            details.useVersion '3.3.1'
        }
        if (details.requested.group == 'org.joml') {
            details.useVersion '1.10.5'
        }
        // Minecraft 1.19.2 ships Gson 2.8.9. Resolve against that API so a
        // future source change cannot silently compile against a newer Gson.
        if (details.requested.group == 'com.google.code.gson'
                && details.requested.name == 'gson') {
            details.useVersion '2.8.9'
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : '[1.19.2,1.20)',
            forge_version           : forge_version,
            forge_version_range     : '[43,)',
            loader_version_range    : '[43,)',
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
    options.deprecation = true
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

tasks.named('jarJar').configure {
    enabled = true
    from("${buildDir}/tmp/compileJava/compileJava-refmap.json") {
        rename { 'client.voxy.refmap.json' }
    }
    dependsOn(tasks.compileJava)
}

// Forge 1.19.2 discovers Mixin configs through the JAR manifest generated by
// MixinGradle, rather than relying on mods.toml alone.
mixin {
    add sourceSets.main, 'client.voxy.refmap.json'
    config 'common.voxy.mixins.json'
    config 'client.voxy.mixins.json'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('LICENSE.md') {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'    : project.archives_base_name,
                'Specification-Vendor'   : 'Cortex',
                'Specification-Version'  : project.mod_version,
                'Implementation-Title'   : project.archives_base_name,
                'Implementation-Version' : project.mod_version,
                'Implementation-Vendor'  : 'Cortex'
        ])
    }
}

tasks.register('copyCompileClasspath', Copy) {
    from configurations.compileClasspath
    into layout.buildDirectory.dir('compile-classpath')
}
