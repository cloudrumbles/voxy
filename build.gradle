plugins {
    id 'dev.architectury.loom' version '1.4-SNAPSHOT'
    id 'maven-publish'
    // Used to relocate net.jpountz.* (lz4-java) into a voxy-private package
    // path. Without this, the bundled lz4 collides with other Forge mods that
    // also ship lz4 (e.g. chisels-and-bits via scena's JIJ'd lz4-pure-java) —
    // JPMS forbids package overlap across modules in one ModuleLayer and the
    // game silent-exits during ModLauncher class-transform.
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = file("src/main/resources/voxy.accesswidener")

    forge {
        convertAccessWideners = true
        mixinConfigs = [
                "client.voxy.mixins.json",
                "common.voxy.mixins.json"
        ]
    }
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    mavenCentral()
    maven { url = "https://www.cursemaven.com" }
}


def gitCommitHash = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            standardOutput = stdout
            ignoreExitValue = true
        }
        return stdout.toString().trim() ?: "<UnknownCommit>"
    } catch (Exception e) {
        return "<UnknownCommit>"
    }
}

def buildtime = { System.currentTimeMillis() / 1000L }

processResources {
    def time = buildtime()
    def hash = gitCommitHash()
    def ver = project.version

    inputs.properties("version": ver, "commit": hash, "buildtime": time)
    filesMatching("META-INF/mods.toml") {
        expand "version": ver, "commit": hash, "buildtime": time
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    testImplementation platform("org.junit:junit-bom:5.10.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // MixinExtras (bundled with Forge at runtime, needed at compile time)
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5"))

    // Embeddium (Sodium for Forge)
    modImplementation "maven.modrinth:sk9rgfiA:AYqEbec0"

    // Oculus (Iris for Forge)
    modCompileOnly "maven.modrinth:GchcoXML:Mw8aFpWF"

    // Chunky
    modCompileOnly "curse.maven:chunky-pregenerator-forge-485681:3970964"

    // Dynamic Trees (Au Naturel fork). Compile-only — the compat code in
    // me.cortex.voxy.compat.dynamictrees references BranchBlock and Family
    // for the state-proxy resolver. Runtime gated on
    // ModList.isLoaded("dynamictrees"), so no hard dep at install time.
    // Deployed jars in newtest/aunaturel are byte-identical to this build
    // output (md5 4c7215dd...) so the compile target matches the runtime.
    modCompileOnly "maven.modrinth:vdjF5PL5:byXgtF59"
}


// Bumped from 17 to 21 to unlock Integer.compress/expand intrinsics
// (BMI2 PEXT/PDEP on x86) used in the per-voxel hot path. Runtime target
// is Java 26 (Forge 47.4.20 on Java 26); Java 21 is the minimum that
// surfaces the intrinsics while preserving compatibility with any JRE >= 21.
// Compile JDK is pinned to /home/acow/jdk-21.0.9 via gradle.properties
// (org.gradle.java.home) — see also gradle.properties for that pin.
def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
    it.options.deprecation = true
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxHeapSize = "2G"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// A private configuration that pulls the platform-specific native .so/.dll
// payloads out of the LWJGL native-classifier jars. Kept separate from the
// JIJ-bound `include(...)` configuration because Forge's JIJ resolver dedupes
// by group:artifact:version — native-linux and native-windows share those
// with the base jar and would clobber it. Instead we unzip these into the
// voxy jar at the paths LWJGL's Library.loadSystem searches
// (linux/x64/*, windows/x64/*), so LWJGL finds them on the classpath at
// runtime without going through jarjar.
configurations {
    lwjglNativesIntoJar

    // Deps that are RELOCATED into the voxy jar at a voxy-private package
    // path (via shadowJar.relocate below) rather than JIJ'd as a sibling jar.
    // For libraries whose package names commonly conflict across mods (LZ4),
    // this avoids JPMS package-overlap LayerInstantiationExceptions.
    shadowMe {
        // Don't drag transitive deps into the shaded payload — we shade only
        // what we name explicitly.
        transitive = false
    }
    implementation.extendsFrom(shadowMe)
}

// Shared customizations applied to both `jar` (dev / unmapped output) and
// `shadowJar` (what `remapJar` actually consumes for the published artifact).
// Use project.configurations explicitly — shadowJar overrides `configurations`
// on the task itself (it's the list of deps to shade), which would shadow
// project.configurations during property resolution.
def commonJarCustomizations = {
    from("LICENSE.md") {
        rename { "${it}_${project.archives_base_name}" }
    }
    exclude "fabric.mod.json"

    into('') {
        from({ project.configurations.lwjglNativesIntoJar.collect { zipTree(it) } })
        include 'linux/**'
        include 'windows/**'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

jar commonJarCustomizations

shadowJar {
    // Only bundle what we explicitly named as shadowMe. Everything else
    // (voxy's own classes, the other JIJ deps, LWJGL natives) is handled
    // separately — JIJ via include(...) for the deps that don't collide,
    // and the commonJarCustomizations block for LWJGL natives + LICENSE.
    configurations = [project.configurations.shadowMe]

    // Relocate net.jpountz.* (lz4-java's package) into a voxy-private path.
    // Shadow rewrites class names, references in bytecode, AND resource
    // paths matching the prefix — including the bundled native libraries
    // at net/jpountz/util/<os>/<arch>/lib*. At runtime lz4-java's Native
    // class derives its resource path from its own package name (via
    // Class.getResource), so the relocated natives are found at the
    // relocated path. No source-code changes required.
    relocate 'net.jpountz', 'me.cortex.voxy.shaded.lz4'

    // Apply the same customizations as the regular jar task so the output
    // remapJar consumes is a strict superset of what `jar` produces.
    // Inlined (rather than `with commonJarCustomizations`) because `with`
    // is a CopySpec-merge method, not a "call closure with delegate" — and
    // shadowJar shadows `configurations` anyway, see above.
    from("LICENSE.md") {
        rename { "${it}_${project.archives_base_name}" }
    }
    exclude "fabric.mod.json"

    into('') {
        from({ project.configurations.lwjglNativesIntoJar.collect { zipTree(it) } })
        include 'linux/**'
        include 'windows/**'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    // Declare the same MixinConfigs manifest attribute that loom's
    // forge { mixinConfigs } block injects on the regular jar. remapJar
    // reads this from the jar it's processing to discover which mixin
    // configs need refmap remapping. `manifest.from(jar.manifest)` doesn't
    // work here — loom populates jar.manifest in an afterEvaluate hook that
    // fires after this configuration closure, so the copy captures an empty
    // manifest. Setting the attribute directly is unambiguous.
    manifest {
        attributes 'MixinConfigs': 'client.voxy.mixins.json,common.voxy.mixins.json'
    }

    // dev/unmapped classifier; final published name is set on remapJar.
    archiveClassifier.set('shadow')

    // Park the shadow output in a separate directory so remapJar's `doFirst
    // { delete fileTree(build/libs) }` (kept for dev classifier hygiene)
    // doesn't nuke our just-built shadow jar before remap reads it.
    destinationDirectory.set(layout.buildDirectory.dir('shadowlibs'))
}

remapJar {
    // Route loom's remap step through the shaded jar. The plain `jar` task
    // still runs (loom uses it for source-jar generation and dev-runtime
    // assembly) but isn't the upstream of the published artifact.
    dependsOn(shadowJar)
    inputFile.set(shadowJar.archiveFile)

    doFirst {
        delete fileTree(getDestinationDirectory().get())
    }

    if (!isInGHA) {
        def hash = gitCommitHash();
        if (!hash.equals("<UnknownCommit>")) {
            archiveClassifier.set(hash);
        }
    }
}

project.ext.lwjglVersion = "3.3.1"

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    include(implementation "org.lwjgl:lwjgl-zstd:$lwjglVersion")
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-linux"
    // Native classifier jars share the same Forge JIJ identifier (group:artifact:version)
    // as the base jar; JIJ dedup keeps only one, breaking JPMS module resolution.
    // Kept on gradle runtime classpath for local tests; do NOT include() in the jar.
    runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    // And additionally: unzip these into the voxy jar root so LWJGL's
    // Library.loadSystem classpath lookup finds liblwjgl_zstd.so /
    // lwjgl_zstd.dll at runtime. The jar task above references this
    // configuration to do the actual extraction.
    lwjglNativesIntoJar "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-windows"
    lwjglNativesIntoJar "org.lwjgl:lwjgl-zstd:$lwjglVersion:natives-linux"

    include(implementation 'redis.clients:jedis:5.1.0')
    include(implementation('org.rocksdb:rocksdbjni:10.2.1'))
    include(implementation 'org.apache.commons:commons-pool2:2.12.0')
    // lz4-java is SHADED into the voxy jar (relocated to me.cortex.voxy.shaded.lz4.*)
    // instead of JIJ'd, to avoid JPMS package-overlap with other Forge mods
    // that bundle their own lz4 (e.g. chisels-and-bits → scena → lz4-pure-java).
    // See shadowJar block above and project_aunaturel_silent_failure.md.
    shadowMe 'org.lz4:lz4-java:1.8.0'
    include(implementation('org.tukaani:xz:1.10'))
}