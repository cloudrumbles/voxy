# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon = false

# Compile JDK pin. Required because:
#   1. build.gradle targets Java 21 (--release 21) to unlock
#      Integer.compress/expand intrinsics (BMI2 PEXT/PDEP) used in the
#      per-voxel hot path.
#   2. System default JDK is Java 17; gradle needs a JDK >= 21 to honour
#      --release 21.
# Update this if the JDK install path changes; runtime target remains
# Java 26 (Forge 47.4.20).

loom.platform = forge

# Minecraft Properties
minecraft_version=1.19.2
forge_version=43.5.2

# Mod Properties
mod_version=0.2.11-alpha-forge-1.19.2
maven_group = me.cortex
archives_base_name=voxy-forge-1.19.2