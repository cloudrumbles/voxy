# Gradle
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false
# 网络不稳定时增加重试
org.gradle.internal.publish.checksums.insecure=true
# 禁用工具链自动下载,优先用 JAVA_HOME / 环境提供的 JDK (CI 通过 actions/setup-java 提供)
org.gradle.java.installations.auto-download=false
# 允许从 JAVA_HOME 环境变量探测 JDK (兼容本地沙箱和 CI)
org.gradle.java.installations.fromEnv=JAVA_HOME
# 本机沙箱 Java 17 路径 (CI 环境会在 workflow 中删除此行,改由 actions/setup-java 提供)

# Forge / Minecraft
minecraft_version=1.19.2
forge_version=43.5.2
parchment_version=2022.11.27
parchment_minecraft_version=1.19.2

# Renderer compatibility
embeddium_version=0.3.32-beta.90+mc1.19.2
oculus_compile_version=Mw8aFpWF
mixin_extras_version=0.5.4

# Mod Properties
mod_version=0.2.14-alpha-forge.1
maven_group=me.cortex
archives_base_name=voxy-forge-1.19.2

# Java
java_version=17
