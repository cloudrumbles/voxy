modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All-Rights-Reserved"
issueTrackerURL = "https://github.com/MCRcortex/voxy/issues"

[[mods]]
modId = "voxy"
version = "${mod_version}"
displayName = "Voxy"
authors = "Cortex"
displayTest = "IGNORE_SERVER_VERSION"
description = '''
Far distance rendering mod utilising LoDs.
Backported to Forge 1.19.2 with parity tests for stable core behaviour.
'''

[[dependencies.voxy]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.voxy]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Forge 1.19.2 includes the Mixin bootstrap; declare Voxy's client mixins here.
[[mixins]]
    config = "client.voxy.mixins.json"
